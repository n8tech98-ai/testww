name: Build DonutFabric

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: donut-fabric
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Find jar
        run: find . -name "*.jar" -not -path "*/tmp/*" -not -name "*-dev.jar" -not -name "*-sources.jar"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: donutfabric-jar
          path: donut-fabric/build/libs/*[0-9].jar
          if-no-files-found: error
